[versions]
kotlin = "2.1.20"
compose = "1.8.0"
coroutines = "1.10.2"
serialization = "1.8.1"
datetime = "0.7.1"
io = "0.6.0"
atomicfu = "0.27.0"
ktor = "3.1.2"
okhttp = "4.12.0"
jackson = "2.18.3"
jsoup = "1.18.3"
ksoup = "0.2.3"
nicehttp = "0.4.11"
rhino = "1.8.1"
annotation = "1.9.1"
jna = "5.16.0"
sqlite = "3.49.1.0"
coil = "3.1.0"
junit = "5.12.1"
cryptography = "0.4.0"
newpipeextractor = "v0.24.8"
json = "20250107"
kotlinx-html = "0.12.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "io" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
ktor-http = { module = "io.ktor:ktor-http", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
nicehttp = { module = "com.github.Blatzar:NiceHttp", version.ref = "nicehttp" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.12.1" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }
newpipeextractor = { module = "com.github.teamnewpipe:NewPipeExtractor", version.ref = "newpipeextractor" }
json = { module = "org.json:json", version.ref = "json" }
dex2jar-translator = { module = "com.googlecode.dex2jar:dex-translator", version = "2.1" }
dex2jar-reader = { module = "com.googlecode.dex2jar:dex-reader", version = "2.1" }
asm = { module = "org.ow2.asm:asm", version = "9.7.1" }
asm-commons = { module = "org.ow2.asm:asm-commons", version = "9.7.1" }
dexlib2 = { module = "com.android.tools.smali:smali-dexlib2", version = "3.0.9" }
guava = { module = "com.google.guava:guava", version = "33.4.0-jre" }
commons-compress = { module = "org.apache.commons:commons-compress", version = "1.27.1" }
xz = { module = "org.tukaani:xz", version = "1.10" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }

[bundles]
cryptography = ["cryptography-core", "cryptography-jdk"]
