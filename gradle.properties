org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Drop the Gradle daemon shortly after the last task so OpenJDK is not left resident.
org.gradle.daemon.idletimeout=5000
# Compile in-process so a second KotlinCompileDaemon JVM is not left running.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.jvm.target.validation.mode=warning
compose.desktop.verbose=true
